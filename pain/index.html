<style>
:root{
  --bg:#FFF8EC; --surface:#FFFFFF; --ink:#2B1B06; --muted:#8A6A3A; --line:#F0DFBB;
  --accent:#E8871E; --on-accent:#241100; --link:#B4550A;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Unbounded","Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:clamp(16px,4vw,40px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1200; --surface:#2A1D0C; --ink:#FBF0DC; --muted:#C9A46B; --line:#4A3410;
    --accent:#FDB44B; --on-accent:#241100; --link:#FFC169; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1200; --surface:#2A1D0C; --ink:#FBF0DC; --muted:#C9A46B; --line:#4A3410;
  --accent:#FDB44B; --on-accent:#241100; --link:#FFC169; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:880px;margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:600 1rem var(--font-head);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:50%;display:block}
.top-note{font-size:.85rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 1rem var(--font-body);text-decoration:none;border:0;cursor:pointer;text-align:center;touch-action:manipulation}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

main{max-width:880px;margin:0 auto;padding:clamp(24px,5vw,56px) var(--pad) 40px}
.wiz{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4vw,40px)}
.wiz-top{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease}

h1{font:600 clamp(1.6rem,4vw,2.4rem)/1.16 var(--font-head);letter-spacing:-.01em;margin:0 0 18px;overflow-wrap:break-word}
.step-title{font:600 clamp(1.15rem,2.6vw,1.45rem)/1.3 var(--font-head);margin:0 0 6px;outline:none}
.step-hint{color:var(--muted);margin:0 0 26px;max-width:62ch}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch;margin:0 0 24px}

.field{margin:0 0 30px;padding:0;border:0;min-width:0}
.flabel{font-weight:600;margin:0 0 4px;padding:0;line-height:1.4}
.fhint{font-size:.9rem;color:var(--muted);margin:0 0 12px}
.flabel+.opts,.flabel+.scale,.flabel+textarea,.flabel+.inputs{margin-top:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;display:inline-block;touch-action:manipulation}
.pill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.pill span{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:.98rem;line-height:1.3;background:var(--bg)}
.pill input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.pill input:disabled{cursor:not-allowed}
.pill input:disabled+span{opacity:.45}
.other-input{margin-top:10px}
textarea,input[type=text]{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
input[type=text]{min-height:50px;padding:0 14px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale .pill{display:block}
.scale .pill span{display:flex;justify-content:center;padding:12px 0}
.scale-ends{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.85rem;margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;margin-top:12px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.inputs{display:grid;gap:14px}
.inputs label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.err{color:var(--link);font-weight:600;margin:0 0 14px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.intro-list{list-style:none;padding:0;margin:0 0 28px}
.intro-list li{padding:12px 0 12px 30px;border-top:1px solid var(--line);position:relative}
.intro-list li:last-child{border-bottom:1px solid var(--line)}
.intro-list li::before{content:"✓";position:absolute;left:4px;top:12px;color:var(--accent);font-weight:600}
.done p{color:var(--muted);max-width:60ch}

footer{max-width:880px;margin:0 auto;padding:12px var(--pad) 40px;font-size:.88rem;color:var(--muted)}
footer p{margin:0 0 8px}
.extlink{color:var(--link);text-decoration:underline;text-underline-offset:2px}

@media (max-width:520px){
  .pill span{padding:9px 14px;font-size:.95rem}
  .nav .btn{flex:1}
  .top-note{display:none}
}
</style>
</head>

    if(s.id!=='intro'&&s.id!=='done'){
      var last = vs[cur+1] && vs[cur+1].id==='done';
      h+='<p class="err" id="err" hidden></p><div class="nav"><button class="btn btn-ghost" type="button" data-act="back">Назад</button>'+
         '<button class="btn" type="button" data-act="next">'+(last?'Отправить':'Далее')+'</button></div>';
    }
    stage.innerHTML=h;
    refreshLimits();
    var t=stage.querySelector('.step-title, h1'); if(t && cur>0){ t.setAttribute('tabindex','-1'); t.focus({preventScroll:true}); }
    window.scrollTo({top:0,behavior:'smooth'});
    if(s.id==='done') send();
  }

  /* ===== Ввод ===== */
  stage.addEventListener('change',function(e){
    var el=e.target;
    if(el.dataset.idk){ var k=el.dataset.idk; idk[k]=el.checked; var ta=stage.querySelector('textarea[name="'+k+'"]'); ta.disabled=el.checked; if(el.checked){ta.value='';a[k]='';} return; }
    if(el.id==='consent'){ contact.consent=el.checked; return; }
    var key=el.name; if(!key||!Q[key]) return;
    var q=Q[key];
    if(q.type==='many'){
      var boxes=stage.querySelectorAll('input[name="'+key+'"]');
      if(el.checked && q.excl){
        var isEx=q.excl.indexOf(el.value)>=0;
        boxes.forEach(function(b){ if(b!==el && (isEx || q.excl.indexOf(b.value)>=0)) b.checked=false; });
      }
      a[key]=[].filter.call(boxes,function(b){return b.checked;}).map(function(b){return b.value;});
    } else { a[key]=el.value; }
    var oi=stage.querySelector('[data-other="'+key+'"]');
    if(oi){ oi.hidden=!has(key,OTHER); if(!oi.hidden && el.value===OTHER && el.checked) oi.focus(); }
    refreshLimits();
    // при смене ответа, влияющего на ветвление, кнопка «Отправить/Далее» может поменяться
    var vs=visible(), lastBtn=stage.querySelector('[data-act="next"]');
    if(lastBtn){ var nxt=vs[cur+1]; lastBtn.textContent=(nxt&&nxt.id==='done')?'Отправить':'Далее'; }
  });
  stage.addEventListener('input',function(e){
    var el=e.target;
    if(el.dataset.other) other[el.dataset.other]=el.value;
    else if(el.tagName==='TEXTAREA') a[el.name]=el.value;
    else if(el.id==='cname') contact.name=el.value;
    else if(el.id==='ccontact') contact.contact=el.value;
  });
  function refreshLimits(){
    Object.keys(Q).forEach(function(k){
      var q=Q[k]; if(!q.max) return;
      var boxes=stage.querySelectorAll('input[name="'+k+'"]'); if(!boxes.length) return;
      var n=(a[k]||[]).length;
      boxes.forEach(function(b){ b.disabled = !b.checked && n>=q.max; });
    });
  }

  function validate(s){
    if(s.id==='contact'){
      if(!contact.name.trim()) return 'Напишите, как к вам обращаться.';
      if(!contact.contact.trim()) return 'Оставьте контакт: Telegram, ВК, Макс или телефон.';
      if(!contact.consent) return 'Нужно согласие на обработку данных, иначе мы не сможем с вами связаться.';
      return '';
    }
    for(var i=0;i<(s.qs||[]).length;i++){
      var k=s.qs[i], q=Q[k], v=a[k];
      if(q.req && (!v || (Array.isArray(v)&&!v.length))) return 'Ответьте, пожалуйста, на вопрос «'+q.t+'»';
      if(has(k,OTHER) && !(other[k]||'').trim()) return 'Уточните вариант «Другое» в вопросе «'+q.t+'»';
    }
    return '';
  }

  stage.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) { if(e.target.id==='resend') send(true); return; }
    var vs=visible(), s=vs[cur];
    if(b.dataset.act==='back'){ cur=Math.max(0,cur-1); render(); return; }
    var msg=validate(s);
    if(msg){ var er=document.getElementById('err'); er.textContent=msg; er.hidden=false; return; }
    cur=Math.min(cur+1, visible().length-1);
    render();
  });

  /* ===== Отправка в Telegram ===== */
  function raw(k){
    var v=a[k];
    if(idk[k]) return ['Не знаю'];
    if(v===undefined||v===''||(Array.isArray(v)&&!v.length)) return [];
    return (Array.isArray(v)?v:[v]).map(function(x){ return x===OTHER ? 'другое: '+(other[k]||'').trim() : x; });
  }
  function shown(k){
    var vs=visible().map(function(s){return s.id;});
    return STEPS.some(function(s){ return s.qs && s.qs.indexOf(k)>=0 && vs.indexOf(s.id)>=0; });
  }

  /* Короткие формы вариантов для Telegram */
  var SHORT = {
    'Для себя':'за себя','Для ребёнка (отвечаю как родитель)':'за ребёнка','Для родителя (отвечаю за маму или папу)':'за родителя',
    'В основном сижу (офис, учёба)':'сидячий','В основном на ногах (работа стоя или в движении)':'на ногах','Смешанно':'смешанный','Много спорта или активности':'спорт',
    'Боль или усталость в стопах':'стопы','«Косточка» на большом пальце (вальгусная деформация)':'косточка','Тазобедренные суставы':'тазобедр.','Поясница или спина':'спина',
    'Икры (судороги, забитость)':'икры','Ноги быстро устают при ходьбе':'ноги устают','Неравномерно стаптывается обувь':'стаптывается обувь',
    'ЛФК или упражнения по видео дома':'ЛФК/видео дома','Массаж, остеопат, мануальный терапевт':'массаж/остеопат','Ортопед или биомеханик':'ортопед/биомеханик',
    'Другой врач (невролог, травматолог, терапевт)':'другой врач','Ортопедические стельки (готовые)':'готовые стельки','Индивидуальные стельки на заказ':'стельки на заказ',
    'Обезболивающие, мази':'обезболивающие','Долго или неудобно добираться':'далеко ездить','Не вижу результата или прогресса':'не видно прогресса',
    'Непонятно, правильно ли я делаю':'непонятно, правильно ли','Сложно себя заставить регулярно':'нет регулярности',
    'Не знаю, к кому обратиться и что делать':'не знаю, к кому идти','Пробовал(а) раньше, не помогло':'пробовал(а), не помогло',
    'Чтобы встраивалось в обычную жизнь без усилий':'встраивается в жизнь','Доказанный медицинский результат':'доказанный результат',
    'Не тратить время на поездки':'без поездок','Видеть свой прогресс в цифрах':'прогресс в цифрах','Личное сопровождение врача':'сопровождение врача',
    'Да, созвон':'созвон','Да, голосовыми сообщениями':'голосовые','Да, перепиской':'переписка'
  };
  function sh(k){ return raw(k).map(function(x){ var s=SHORT[x]; return s || (x.charAt(0).toLowerCase()+x.slice(1)); }).join(', '); }
  function h(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function cut(s,n){ s=String(s); return s.length>n ? s.slice(0,n)+'…' : s; }

  function buildText(){
    var L=[], pain=noPain()?'ничего не беспокоит':sh('pain');
    var head=['🦶 '+a.age, sh('who'), pain];
    if(shown('sev')) head.push(a.sev+'/5');
    head.push(wantsInterview()?'интервью ✅':'интервью —');
    L.push('<b>'+h(head.join(' · '))+'</b>');
    L.push('');
    L.push('<b>Кто:</b> '+h(sh('who'))+', '+h(a.age)+' · <b>день:</b> '+h(sh('day')));
    if(!noPain()){
      L.push('<b>Боль:</b> '+h(sh('pain')));
      L.push('<b>Частота:</b> '+h(sh('freq'))+' · <b>мешает:</b> '+h(a.sev)+'/5');
      var last=raw('last').join(''); L.push('<b>Последний раз:</b> '+(last?(idk.last?'не знаю':'«'+h(cut(last,500))+'»'):'—'));
      L.push('');
      L.push('<b>Решает:</b> '+h(sh('solve')));
      if(doesNothing()){
        L.push('<b>Почему ничего:</b> '+h(sh('whynot')));
      } else {
        L.push('<b>Помогает:</b> '+h(a.help)+'/5 · <b>траты за 6 мес:</b> '+h(sh('spend')));
        L.push('<b>Раздражает:</b> '+h(sh('annoy')));
      }
      L.push('');
      L.push('<b>Важно:</b> '+h(sh('imp')));
      var dream=raw('dream').join(''); if(dream) L.push('<b>Мечта:</b> «'+h(cut(dream,500))+'»');
    }
    if(wantsInterview()){
      L.push('');
      L.push('<b>📞 '+h(cut(contact.name.trim(),80))+' · '+h(cut(contact.contact.trim(),120))+' · '+h(sh('intv'))+'</b>');
    }
    return L.join('\n');
  }

  var sent=false;
  function send(force){
    if(sent && !force) return;
    sent=true;
    var jobs=[];
    var body='chat_id='+encodeURIComponent(TELEGRAM_CHAT_ID)+'&parse_mode=HTML&text='+encodeURIComponent(buildText());
    if(TELEGRAM_THREAD_ID && TELEGRAM_THREAD_ID.indexOf('__')!==0) body+='&message_thread_id='+encodeURIComponent(TELEGRAM_THREAD_ID);
    jobs.push(fetch('https://api.telegram.org/bot'+TELEGRAM_BOT_TOKEN+'/sendMessage',{
      method:'POST', mode:'no-cors', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body
    }));
    var err=document.getElementById('sendErr'), rb=document.getElementById('resend');
    Promise.all(jobs).then(function(){ if(err){err.hidden=true; rb.hidden=true;} })
      .catch(function(){ if(err){err.hidden=false; rb.hidden=false;} });
  }
  render();
})();
</script>
</body>
</html>
